name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vite frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BASE_PATH: /

      - name: Verify production build output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          if grep -Eq 'src="/src/main\.tsx"|%BASE_URL%' dist/index.html; then
            echo "::error::dist/index.html still contains unprocessed Vite source references."
            sed -n '1,140p' dist/index.html
            exit 1
          fi
          echo "Production HTML:"
          sed -n '1,100p' dist/index.html
          echo "Generated assets:"
          find dist/assets -maxdepth 1 -type f -printf '%p (%s bytes)\n'

      - name: Prepare GitHub Pages output
        shell: bash
        run: |
          set -euo pipefail
          cp dist/index.html dist/404.html
          printf '%s\n' 'gtaviwaitlist.run.place' > dist/CNAME
          test -s dist/index.html
          test -s dist/404.html
          test "$(cat dist/CNAME)" = "gtaviwaitlist.run.place"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
