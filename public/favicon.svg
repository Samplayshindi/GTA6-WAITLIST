  <rect width="64" height="64" rx="14" fill="#08090D" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="url(#gta-grad)" stroke-width="2" stroke-opacity="0.8" />
  <text x="32" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" font-style="italic" text-anchor="middle" fill="url(#gta-grad)" filter="url(#neon-glow)" letter-spacing="-1">VI</text>
