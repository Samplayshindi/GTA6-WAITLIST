<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | GTA VI Waitlist</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #08090D;
        color: #F4F1ED;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 440px;
        background: #121318;
        border: 1px solid #24262B;
        border-radius: 16px;
        padding: 36px 28px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      }
      .logo {
        height: 64px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 20px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 12px;
        color: #FF4FA3;
      }
      p {
        font-size: 13px;
        line-height: 1.6;
        color: #A1A1AA;
        margin-bottom: 24px;
      }
      button {
        background: #F4F1ED;
        color: #08090D;
        border: none;
        padding: 12px 24px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/gta-vi-logo.svg" alt="GTA VI" class="logo" />
      <h1>Offline Mode</h1>
      <p>You are currently offline. Check your internet connection to receive real-time Newswire updates and streaming broadcasts.</p>
      <button onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
