<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#102D2A"/>
      <stop offset="40%" stop-color="#0B2425"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Metallic Chrome Cross Gradient -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F1ED"/>
      <stop offset="25%" stop-color="#D1D5DB"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="75%" stop-color="#F15A24"/>
      <stop offset="100%" stop-color="#FF4FA3"/>
    </linearGradient>

    <!-- Neon Rim Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- Subtle Vinyl Groove Rings -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5" />

  <!-- Sunset Orange & Pink Atmospheric Light Beam -->
  <path d="M 120,512 L 256,120 L 392,512 Z" fill="#F15A24" opacity="0.08" />
  <circle cx="256" cy="220" r="120" fill="#FF4FA3" opacity="0.12" filter="url(#neonGlow)" />

  <!-- Justice Iconic Cross Emblem -->
  <g filter="url(#neonGlow)">
    <!-- Vertical Cross Stem -->
    <rect x="242" y="110" width="28" height="220" rx="4" fill="url(#chrome)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1" />
    <!-- Horizontal Cross Bar -->
    <rect x="180" y="160" width="152" height="28" rx="4" fill="url(#chrome)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1" />
  </g>

  <!-- Typography: Artist & Title -->
  <text x="256" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#F4F1ED" text-anchor="middle" letter-spacing="6">JUSTICE</text>
  <text x="256" y="412" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" fill="#F15A24" text-anchor="middle" letter-spacing="4">FLOWER IN A HURRICANE</text>
  <text x="256" y="438" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">FEAT. TAME IMPALA · SZA · KING GIZZARD</text>

  <!-- Outer Hairline Frame -->
  <rect x="12" y="12" width="488" height="488" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
</svg>
